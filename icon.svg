<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F9F8F4"/>
      <stop offset="100%" stop-color="#E6E2DA"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8B6A0"/>
      <stop offset="100%" stop-color="#8C9A84"/>
    </linearGradient>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.176  0 0 0 0 0.227  0 0 0 0 0.192  0 0 0 0.05 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <!-- Alabaster background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle paper grain texture -->
  <rect width="512" height="512" rx="112" filter="url(#paper)"/>
  <!-- Soft sage halo -->
  <circle cx="256" cy="256" r="170" fill="#DCE2D7"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.5"/>
  <!-- Wrench in deep forest -->
  <g transform="translate(256 256) scale(13) translate(-12 -12)" fill="#2D3A31">
    <path d="M22.7 4.5a1 1 0 0 0-1.7-.5l-3 3-2.1-2.1 3-3a1 1 0 0 0-.5-1.7 6.5 6.5 0 0 0-7.9 8.4L2.7 16.4a2.4 2.4 0 0 0 3.4 3.4l8.3-7.8a6.5 6.5 0 0 0 8.3-7.5zM5 18.5a1 1 0 1 1 1.4-1.4A1 1 0 0 1 5 18.5z"/>
  </g>
</svg>
